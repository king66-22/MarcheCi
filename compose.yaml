# ============================================================
# MarchéCI — orchestration complète (une seule commande : docker compose up)
#   démarrage : docker compose up -d --build   (moteur < 2 min sur 4 Go)
#   scaling   : docker compose up -d --scale catalogue=3
#
# Décisions maîtrisées (docs/architecture/01-05) :
#   * 1 serveur PostgreSQL + 4 bases logiques (budget mémoire VM 4 Go)
#   * Redis cache 60 s sur la liste produits
#   * RabbitMQ durable : queue order.created + DLQ order.created.dlq
#   * réseaux séparés front / back ; SEULE la gateway expose un port (80)
#   * aucune donnée (DB, cache, broker) n'est exposée publiquement
# ============================================================

name: marcheci

x-app-peers: &front-back
  networks:
    - front
    - back

services:
  # ---------------- Infrastructure (réseau BACK uniquement) ----------------
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER}
      PGCAT_USER: ${PGCAT_USER}
      PGCAT_DB: ${PGCAT_DB}
      PGCAT_PASSWORD_FILE: /run/secrets/catalogue_db_password
      PGCMD_USER: ${PGCMD_USER}
      PGCMD_DB: ${PGCMD_DB}
      PGCMD_PASSWORD_FILE: /run/secrets/commandes_db_password
      PGUSR_USER: ${PGUSR_USER}
      PGUSR_DB: ${PGUSR_DB}
      PGUSR_PASSWORD_FILE: /run/secrets/utilisateurs_db_password
      PGNTF_USER: ${PGNTF_USER}
      PGNTF_DB: ${PGNTF_DB}
      PGNTF_PASSWORD_FILE: /run/secrets/notifications_db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks: [back]
    secrets: [postgres_owner_password, catalogue_db_password, commandes_db_password, utilisateurs_db_password, notifications_db_password]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [back]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    entrypoint: ["/bin/sh", "-c"]
    command: ["export RABBITMQ_DEFAULT_PASS=\"$(cat /run/secrets/rabbitmq_password)\"; exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server"]
    secrets: [rabbitmq_password]
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks: [back]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------- Migrations one-shot (une par SERVICE, pas par réplique) ----------------
  migrate-catalogue:
    build: services/catalogue
    image: marcheci/catalogue
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &env-catalogue
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/catalogue_database_url
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      PRODUCTS_CACHE_TTL_SECONDS: "60"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MEDIA_ROOT: /data/media
      MEDIA_MAX_UPLOAD_MB: "8"
    secrets: [catalogue_database_url, jwt_secret]
    networks: [back]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    mem_limit: 224m

  migrate-utilisateurs:
    build: services/utilisateurs
    image: marcheci/utilisateurs
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &env-utilisateurs
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/utilisateurs_database_url
      REDIS_URL: redis://redis:6379/1
      REDIS_ENABLED: "true"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_MINUTES: "60"
      SYSTEM_EMAIL: ${SVC_COMMANDES_EMAIL}
    networks: [back]
    secrets: [utilisateurs_database_url, jwt_secret]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    mem_limit: 224m

  migrate-commandes:
    build: services/commandes
    image: marcheci/commandes
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &env-commandes
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/commandes_database_url
      CATALOGUE_URL: http://catalogue:8000
      UTILISATEURS_URL: http://utilisateurs:8000
      EVENTS_ENABLED: "true"
      CONSUMER_MAX_RETRIES: "3"
      CONSUMER_RETRY_BACKOFF_SECONDS: "2"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SVC_COMMANDES_EMAIL: ${SVC_COMMANDES_EMAIL}
      SVC_COMMANDES_PASSWORD_FILE: /run/secrets/svc_commandes_password
    networks: [back]
    secrets: [commandes_database_url, rabbitmq_password, jwt_secret, svc_commandes_password]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    mem_limit: 224m

  migrate-notifications:
    build: services/notifications
    image: marcheci/notifications
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &env-notifications
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/notifications_database_url
      EVENTS_ENABLED: "true"
      CONSUMER_MAX_RETRIES: "3"
      CONSUMER_RETRY_BACKOFF_SECONDS: "2"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    networks: [back]
    secrets: [notifications_database_url, rabbitmq_password, jwt_secret]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    mem_limit: 224m

  # ---------------- Amorçage des comptes (one-shot, idempotent) ----------------
  bootstrap:
    build: services/utilisateurs
    command: ["python", "/scripts/init_admins.py"]
    environment:
      <<: *env-utilisateurs
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SVC_COMMANDES_EMAIL: ${SVC_COMMANDES_EMAIL}
      SVC_COMMANDES_PASSWORD_FILE: /run/secrets/svc_commandes_password
    volumes:
      - ./docker/bootstrap:/scripts:ro
    networks: [back]
    secrets: [admin_password, svc_commandes_password, utilisateurs_database_url, jwt_secret]
    depends_on:
      migrate-utilisateurs: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 224m

  # ---------------- Microservices (réseaux front + back) ----------------
  catalogue:
    image: marcheci/catalogue
    environment: *env-catalogue
    secrets: [catalogue_database_url, jwt_secret]
    <<: *front-back
    volumes:
      # Photos produits : lecture/écriture par Catalogue, lecture seule par la gateway.
      - media_data:/data/media
    depends_on:
      migrate-catalogue: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 224m
    # PAS de ports publiés et PAS de container_name : indispensable pour
    # `docker compose up -d --scale catalogue=3` (DNS round-robin via Nginx).
    # Pas de deploy.replicas : c'est --scale qui fait foi (Étape 5).

  commandes:
    image: marcheci/commandes
    environment: *env-commandes
    secrets: [commandes_database_url, rabbitmq_password, jwt_secret, svc_commandes_password]
    <<: *front-back
    depends_on:
      migrate-commandes: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      catalogue: { condition: service_healthy }
      utilisateurs: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 224m

  utilisateurs:
    image: marcheci/utilisateurs
    environment: *env-utilisateurs
    secrets: [utilisateurs_database_url, jwt_secret]
    <<: *front-back
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 224m

  notifications:
    image: marcheci/notifications
    environment: *env-notifications
    secrets: [notifications_database_url, rabbitmq_password, jwt_secret]
    <<: *front-back
    depends_on:
      migrate-notifications: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 224m

  # ---------------- Gateway (SEUL service exposé) ----------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    volumes:
      - media_data:/var/www/media:ro
    networks: [front]
    depends_on:
      catalogue: { condition: service_healthy }
      commandes: { condition: service_healthy }
      utilisateurs: { condition: service_healthy }
      notifications: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 64m

networks:
  front:
    driver: bridge
  back:
    driver: bridge

volumes:
  pgdata:
  rabbitdata:
  media_data:

secrets:
  postgres_owner_password:
    file: ./secrets/postgres_owner_password.secret
  catalogue_db_password:
    file: ./secrets/catalogue_db_password.secret
  commandes_db_password:
    file: ./secrets/commandes_db_password.secret
  utilisateurs_db_password:
    file: ./secrets/utilisateurs_db_password.secret
  notifications_db_password:
    file: ./secrets/notifications_db_password.secret
  catalogue_database_url:
    file: ./secrets/catalogue_database_url.secret
  commandes_database_url:
    file: ./secrets/commandes_database_url.secret
  utilisateurs_database_url:
    file: ./secrets/utilisateurs_database_url.secret
  notifications_database_url:
    file: ./secrets/notifications_database_url.secret
  jwt_secret:
    file: ./secrets/jwt_secret.secret
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.secret
  svc_commandes_password:
    file: ./secrets/svc_commandes_password.secret
  admin_password:
    file: ./secrets/admin_password.secret
