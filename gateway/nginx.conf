worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # RESOLVEUR DOCKER — clé du scaling : les répliques de « catalogue » sont
    # re-résolues toutes les 5 s (docker DNS 127.0.0.11). Un `docker compose
    # up -d --scale catalogue=3` se répartit SANS redémarrage de la gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Pools keepalive vers les microservices.
    # `server ... resolve` (nginx >= 1.27.3) ré-interroge le DNS Docker, donc
    # le scaling reste dynamique SANS casser le réemploi des connexions TCP
    # (un proxy_pass avec variable ouvrirait une connexion par requête).
    upstream catalogue_backend {
        zone catalogue_backend 64k;
        server catalogue:8000 resolve;
        keepalive 64;
    }

    upstream commandes_backend {
        zone commandes_backend 64k;
        server commandes:8000 resolve;
        keepalive 32;
    }

    upstream utilisateurs_backend {
        zone utilisateurs_backend 64k;
        server utilisateurs:8000 resolve;
        keepalive 32;
    }

    upstream notifications_backend {
        zone notifications_backend 64k;
        server notifications:8000 resolve;
        keepalive 32;
    }

    # Valeurs communes à tous les proxys (doc §4 : timeouts + en-têtes)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pages d'erreur JSON — pas d'HTML brut (contrat d'API)
    error_page 500 502 503 504 = @fallback;

    # Photos produits : 8 Mo max côté API + marge multipart/form-data
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    server {
        listen 8080;

        location @fallback {
            default_type application/json;
            return 503 '{"detail":"Service momentanément indisponible. Réessayez dans quelques secondes."}';
        }

        # ---------- API : routing par préfixe → microservice ----------
        # Pools upstream keepalive (voir `upstream` plus haut) : la résolution
        # Docker reste dynamique (scaling à chaud) et les connexions TCP sont
        # réutilisées, ce qui supprime un handshake par requête.
        location /api/catalogue/ {
            rewrite ^/api/catalogue/(.*)$ /$1 break;
            proxy_pass http://catalogue_backend;
            proxy_read_timeout 10s;
        }

        location /api/commandes/ {
            rewrite ^/api/commandes/(.*)$ /$1 break;
            proxy_pass http://commandes_backend;
        }

        location /api/utilisateurs/ {
            rewrite ^/api/utilisateurs/(.*)$ /$1 break;
            proxy_pass http://utilisateurs_backend;
        }

        location /api/notifications/ {
            rewrite ^/api/notifications/(.*)$ /$1 break;
            proxy_pass http://notifications_backend;
        }

        # ---------- OpenAPI (docs pratiques) : proxify par service ----------
        location /docs/catalogue/ {
            rewrite ^/docs/catalogue/(.*)$ /$1 break;
            proxy_pass http://catalogue_backend;
        }
        location /docs/commandes/ {
            rewrite ^/docs/commandes/(.*)$ /$1 break;
            proxy_pass http://commandes_backend;
        }
        location /docs/utilisateurs/ {
            rewrite ^/docs/utilisateurs/(.*)$ /$1 break;
            proxy_pass http://utilisateurs_backend;
        }
        location /docs/notifications/ {
            rewrite ^/docs/notifications/(.*)$ /$1 break;
            proxy_pass http://notifications_backend;
        }

        # ---------- Photos produits : volume media_data monté en lecture seule ----------
        # Catalogue écrit dans /data/media, la gateway sert /media/* depuis
        # /var/www/media. Aucun accès direct au conteneur Catalogue n'est exposé.
        location /media/ {
            alias /var/www/media/;
            access_log off;
            expires 1d;
            autoindex off;
        }

        # ---------- healthcheck nginx (+ santé globale via auth health) ----------
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ---------- SPA : aucune 404 pour les routes React ----------
        location / {
            try_files $uri /index.html;
        }
    }
}
